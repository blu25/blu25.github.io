<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framebusting Demo - Conditional Reload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(245, 158, 11, 0.2);
            transition: all 0.3s ease;
        }

        .iframe-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 150px;
            border: none;
            border-radius: 8px;
            background: #1e293b;
        }

        .note {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        code {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: #e2e8f0;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.querySelector('.status');
            const iframeContainer = document.getElementById('iframe-container');
            
          statusEl.textContent = 'Waiting 3 seconds before framebust...';
          
          // Wait 3 seconds before framebust
          setTimeout(() => {
            statusEl.textContent = 'Attempting framebust...';
            statusEl.style.background = 'rgba(245, 158, 11, 0.1)';
            statusEl.style.color = '#fbbf24';
            statusEl.style.borderColor = 'rgba(245, 158, 11, 0.2)';
                
                // Create and inject the framebusting iframe
                const iframe = document.createElement('iframe');
                iframe.id = 'target-iframe';
                iframe.src = "data:text/html;charset=utf-8,<!DOCTYPE html><html><head><style>body{font-family:sans-serif;color:%2394a3b8;background:%231e293b;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}</style></head><body><div>Iframe content. Attempting framebust...</div><script>console.log('Iframe: Attempting to navigate top frame...');try{window.top.location='https://example.com';}catch(e){console.error('Iframe failed to navigate top:',e);}<\/script></body></html>";
                iframeContainer.appendChild(iframe);
                
            // 1 second later do a regular refresh
            console.log('Top frame: Setting timeout for refresh...');
                setTimeout(() => {
                  console.log('Top frame: Initiating regular refresh...');
                  window.location.reload();
                }, 1000);
          }, 3000);
        });
    </script>
</head>
<body>

    <div class="container">
        <h1>Framebusting Demo</h1>
        <div class="status">Testing Intervention</div>
        <p>
            This page attempts a framebust after 3 seconds, and performs a regular refresh 1 second later.
        </p>
        
        <div class="iframe-wrapper">
            <div id="iframe-container" style="width: 100%;"></div>
        </div>

        <div class="note">
            The page will loop continuously unless the framebust succeeds.
        </div>
    </div>

</body>
</html>
