<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framebusting Demo - Conditional Reload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(245, 158, 11, 0.2);
            transition: all 0.3s ease;
        }

        .iframe-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 150px;
            border: none;
            border-radius: 8px;
            background: #1e293b;
        }

        .note {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        code {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: #e2e8f0;
        }
    </style>
    <script>
        // Check for autoreload param
        const urlParams = new URLSearchParams(window.location.search);
        const isReloaded = urlParams.has('autoreload');

        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.querySelector('.status');
            const iframeContainer = document.getElementById('iframe-container');
            
            if (isReloaded) {
                statusEl.textContent = 'Reloaded - Skipping Framebust';
                statusEl.style.background = 'rgba(34, 197, 94, 0.1)';
                statusEl.style.color = '#22c55e';
                statusEl.style.borderColor = 'rgba(34, 197, 94, 0.2)';
                
                iframeContainer.innerHTML = '<div style="color: #64748b;">Iframe not loaded (skipped on reload)</div>';
                
                // Remove the param from the URL in the bar
                // This ensures a manual refresh starts the process over
                history.replaceState(null, '', window.location.pathname);
                console.log('Top frame: Cleaned up URL.');
            } else {
                statusEl.textContent = 'First Run - Testing Intervention';
                
                // Create and inject the framebusting iframe
                const iframe = document.createElement('iframe');
                iframe.id = 'target-iframe';
                iframe.src = "data:text/html;charset=utf-8,<!DOCTYPE html><html><head><style>body{font-family:sans-serif;color:%2394a3b8;background:%231e293b;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}</style></head><body><div>Iframe content. Attempting framebust...</div><script>console.log('Iframe: Attempting to navigate top frame...');try{window.top.location='https://example.com';}catch(e){console.error('Iframe failed to navigate top:',e);}<\/script></body></html>";
                iframeContainer.appendChild(iframe);
                
                // Set timeout to reload with param after 1 second
                console.log('Top frame: Setting timeout for auto-reload...');
                setTimeout(() => {
                    console.log('Top frame: Initiating auto-reload...');
                    window.location.href = window.location.pathname + '?autoreload=true';
                }, 1000);
            }
        });
    </script>
</head>
<body>

    <div class="container">
        <h1>Framebusting Demo</h1>
        <div class="status">Testing Intervention</div>
        <p>
            This page demonstrates conditional behavior. On first run, it attempts a framebust. A second later, it reloads and skips the attempt.
        </p>
        
        <div class="iframe-wrapper">
            <div id="iframe-container" style="width: 100%;"></div>
        </div>

        <div class="note">
            Manual refresh or reload will start the cycle over because the URL is cleaned up on the second run.
        </div>
    </div>

</body>
</html>
