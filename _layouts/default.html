<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">

    {% capture title %}Liam Brady{% if page.title %} - {{ page.title }}{% endif %}{% endcapture %}
    <title>{{ title }}</title>
    {% capture description %}{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}{% endcapture %}
    <meta name="description" content="{{ description }}">
    <meta name="author" content="Liam Brady">

    <!-- Link previews in Slack, email, social -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Liam Brady">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/images/og/home.jpg' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
    <link rel="icon" href="{{ '/images/icon-192.png' | relative_url }}" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Opt in to page transitions inline so it never waits on the stylesheet -->
    <style>@view-transition { navigation: auto; }</style>
    <!-- Tag the transition on the arriving page so the CSS can tell it apart from the old page -->
    <script>addEventListener("pagereveal", e => e.viewTransition?.types.add("incoming"));</script>
    <script src="{{ '/js/fade-out.js' | relative_url }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">

  </head>

  <body style="--primary: {{ page.primary | default: '#ffd84d' }}; --secondary: {{ page.secondary | default: '#ffffff' }}">

    {% include nav.html %}
    <div id="grid-container">
{{ content }}
    </div>
  </body>
</html>
