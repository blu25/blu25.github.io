url: https://blu25.github.io
description: Liam Brady is a security engineer on Chrome Security who builds games, instruments, and other art + tech projects on the side.

# Keep notes and tooling files off the published site
exclude:
  - review.md
  - Gemfile
  - Gemfile.lock

# Local `jekyll serve` only (GitHub Pages ignores this). Jekyll's default
# no-store header makes Chrome's page transitions flash white; no-cache
# still re-checks every file, so edits show up on refresh.
webrick:
  headers:
    Cache-Control: no-cache
